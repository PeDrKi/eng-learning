# Cấu hình Fly.io cho tuvung-api. Hướng dẫn: DEPLOY.md, phần "Không dùng GitHub".
# `app` phải là tên duy nhất trên toàn Fly; deploy\lan-dau.bat tự hỏi và sửa dòng này nếu tên đã có người dùng.
app = "eng-learning"
primary_region = "sin" # Singapore, gần Việt Nam nhất; chọn Neon cùng vùng (AWS Singapore)

[build]
  dockerfile = "Dockerfile"

# Chạy migration TRƯỚC khi bản mới nhận request; lỗi thì Fly giữ bản cũ, không deploy.
[deploy]
  release_command = "node src/db/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # FE (*.pages.dev) và BE (*.fly.dev) là 2 site khác nhau → cookie đăng nhập phải SameSite=None.
  # Đổi thành "lax" sau khi gắn tên miền riêng cùng 1 site (app.x.com + api.x.com).
  COOKIE_SAMESITE = "none"
  TRUST_PROXY = "1" # 1 tầng proxy của Fly đứng trước app → rate limit thấy đúng IP người dùng

[http_service]
  internal_port = 8080
  force_https = true
  # Không có ai dùng thì máy tự tắt (gần như không tốn tiền), có request thì tự bật lại sau 1–3 giây.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
