# Postgres chạy local khi phát triển: `docker compose up -d`
# Tạo sẵn 2 database: tuvung_dev (chạy app) và tuvung_test (chạy test).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tuvung
      POSTGRES_PASSWORD: tuvung
      POSTGRES_DB: tuvung_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
